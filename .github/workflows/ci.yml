name: CI - DDEV Studio

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies for PyGObject & GTK 3
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            gir1.2-gtk-3.0 \
            xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGObject flake8

      - name: Check Python Syntax & Compilation
        run: |
          python -m py_compile ddev_manager.py ddev_studio/*.py ddev_studio/**/*.py tests/*.py

      - name: Run Linting Checks
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=160 --statistics

      - name: Run Unit Tests with Virtual Screen (Xvfb)
        run: |
          xvfb-run -a python -m unittest discover -s tests -p "test_*.py" -v
